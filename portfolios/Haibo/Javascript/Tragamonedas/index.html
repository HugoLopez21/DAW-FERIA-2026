<!DOCTYPE html>
<html>
<head>
    <title>Tragamonedas Simple</title> <!--Esto lo he generado eh no hace falta q mires nada aqui :)-->
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: white;
        }
        
        h1 {
            color: #f1c40f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        #maquina {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            display: inline-block;
            margin: 20px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        #rodillos {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        
        .rodillo {
            width: 100px;
            height: 150px;
            background: #2c3e50;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 3px solid #f1c40f;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .simbolo {
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            font-weight: bold;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }
        
        .contador {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        
        .caja {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            min-width: 100px;
        }
        
        .valor {
            font-size: 28px;
            font-weight: bold;
            color: #f1c40f;
        }
        
        .etiqueta {
            font-size: 14px;
            opacity: 0.8;
        }
        
        #controles {
            margin: 20px 0;
        }
        
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        button:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
            transform: none;
        }
        
        #girar {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
        }
        
        #resultado {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
            min-height: 30px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        
        .premio {
            color: #f1c40f;
            animation: premio 0.5s infinite alternate;
        }
        
        @keyframes premio {
            from { color: #f1c40f; }
            to { color: #e74c3c; }
        }
    </style>
</head>
<body>
    <h1>🎰 TRAGAMONEDAS 🎰</h1>
    <p>Este ultimo se hizo por aburrimiento </p>
    <div id="maquina">
        <div id="rodillos">
            <!-- Los 3 rodillos se crearán con JavaScript -->
        </div>
    </div>
    
    <div id="info">
        <div class="contador">
            <div class="caja">
                <div class="etiqueta">CRÉDITOS</div>
                <div id="creditos" class="valor">100</div>
            </div>
            <div class="caja">
                <div class="etiqueta">APUESTA</div>
                <div id="apuesta" class="valor">10</div>
            </div>
            <div class="caja">
                <div class="etiqueta">GANANCIAS</div>
                <div id="ganancias" class="valor">0</div>
            </div>
        </div>
        
        <div id="controles">
            <button id="menosApuesta">-</button>
            <button id="girar">🎯 GIRAR (10 créditos)</button>
            <button id="masApuesta">+</button>
        </div>
        
        <div id="resultado">Presiona GIRAR para jugar</div>
    </div>
    
    <script src="tragamonedas.js"></script>
</body>
</html>
