<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fira FP Orienta't</title>

  <style>
    /*0) Variables base (colores / tipografías)*/
    :root{
      --ink:#111;
      --paper:#fff7e6;
      --yellow:#ffe45c;
      --cyan:#4dd7ff;
      --pink:#ff5aa5;
      --shadow: 8px 8px 0 var(--ink);

      --comicTitle: ui-rounded, "Arial Black", "Trebuchet MS", system-ui, sans-serif;
      --comicBody: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    *{ box-sizing:border-box; }

    /*1) Base layout + background*/
    body{
      margin:0;
      font-family: var(--comicBody);
      color:var(--ink);
      background:
        radial-gradient(circle at 25% 15%, rgba(255,90,165,.18) 0 22%, transparent 23%),
        radial-gradient(circle at 70% 35%, rgba(77,215,255,.18) 0 22%, transparent 23%),
        radial-gradient(circle at 40% 75%, rgba(255,228,92,.18) 0 22%, transparent 23%),
        var(--paper);
      background-size: 220px 220px, 260px 260px, 240px 240px, auto;
    }

    .wrap{ max-width:1100px; margin:0 auto; padding:18px 16px; }

    /*2) Header + toolbar*/
    header{
      position: sticky;
      top:0;
      z-index:10;
      background: rgba(255,247,230,.92);
      backdrop-filter: blur(6px);
      border-bottom: 4px solid var(--ink);
    }

    .titleRow{
      display:flex;
      gap:14px;
      align-items:flex-end;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    h1{
      margin:0;
      font-size: clamp(22px, 3vw, 34px);
      letter-spacing:.5px;
      text-transform: uppercase;
    }

    .subtitle{ margin:6px 0 0; opacity:.85; font-weight:600; }

    .pow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border:4px solid var(--ink);
      border-radius:999px;
      box-shadow: 6px 6px 0 var(--ink);
      background: var(--yellow);
      font-weight:900;
      text-transform: uppercase;
      transform: rotate(-2deg);
      white-space:nowrap;
    }
    .pow small{ font-weight:800; opacity:.75; text-transform:none; }

    .panel{
      border:4px solid var(--ink);
      box-shadow: var(--shadow);
      background:#fff;
      border-radius:18px;
      padding:14px;
      margin-top:16px;
    }

    .toolbar{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-bottom:10px;
    }

    .search{
      display:flex;
      gap:10px;
      align-items:center;
      flex:1;
      min-width:250px;
    }

    input[type="text"]{
      width:100%;
      padding:12px;
      border:3px solid var(--ink);
      border-radius:14px;
      outline:none;
      font-size:14px;
      background:#fffdf6;
    }

    .counter{
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.3px;
      background: var(--pink);
      padding:8px 12px;
      border:4px solid var(--ink);
      border-radius:999px;
      box-shadow: 6px 6px 0 var(--ink);
      transform: rotate(1deg);
      white-space:nowrap;
    }

    /*3) Grid de cards*/
    .cards{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:14px;
    }
    @media (max-width:980px){ .cards{ grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width:640px){ .cards{ grid-template-columns: 1fr; } }

    /*4) Card base + efectos (halftone + grapas) */
    .card{
      position:relative;
      border:4px solid var(--ink);
      border-radius:22px;
      overflow:hidden;
      box-shadow: var(--shadow);
      --dotSize: 9px;
      --dotOpacity: .30;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(circle, rgba(0,0,0,var(--dotOpacity)) 1.2px, transparent 1.3px);
      background-size: var(--dotSize) var(--dotSize);
      opacity:.35;
      pointer-events:none;
    }

    /* “grapas” en esquinas */
    .card::after{
      content:"";
      position:absolute;
      inset: 10px;
      pointer-events:none;
      background:
        linear-gradient(#cfcfcf,#9a9a9a) 0 0/22px 10px no-repeat,
        linear-gradient(#cfcfcf,#9a9a9a) 0 0/10px 22px no-repeat,
        linear-gradient(#cfcfcf,#9a9a9a) 100% 0/22px 10px no-repeat,
        linear-gradient(#cfcfcf,#9a9a9a) 100% 0/10px 22px no-repeat,
        linear-gradient(#cfcfcf,#9a9a9a) 0 100%/22px 10px no-repeat,
        linear-gradient(#cfcfcf,#9a9a9a) 0 100%/10px 22px no-repeat,
        linear-gradient(#cfcfcf,#9a9a9a) 100% 100%/22px 10px no-repeat,
        linear-gradient(#cfcfcf,#9a9a9a) 100% 100%/10px 22px no-repeat;
      filter: drop-shadow(2px 2px 0 rgba(0,0,0,.25));
      opacity:.9;
    }

    .cardInner{ position:relative; }

    .tape{
      position:absolute;
      top:-10px;
      left:12px;
      width:92px;
      height:34px;
      background: rgba(255,228,92,.85);
      border:3px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
      transform: rotate(-8deg);
      border-radius:10px;
      z-index:3;
      pointer-events:none;
    }
    .tape::before{
      content:"";
      position:absolute;
      inset:0;
      background: repeating-linear-gradient(45deg, rgba(0,0,0,.07) 0 6px, transparent 6px 12px);
      opacity:.6;
      border-radius:8px;
    }

    .avatar{
      width:100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      border-bottom:4px solid var(--ink);
      background:#0710207a;
    }

    .cardBody{ padding:12px; }

    .cardTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .name{
      margin:0;
      font-size:18px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.3px;
    }

    .desc{
      margin:8px 0 12px;
      font-size:14px;
      line-height:1.3;
      opacity:.9;
      white-space: pre-wrap;
    }

    .pill{
      display:inline-flex;
      gap:8px;
      align-items:center;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.2px;
      font-size:12px;
      border:3px solid var(--ink);
      border-radius:999px;
      background: var(--yellow);

      /* Para que el texto largo (profe) no se corte */
      white-space: normal;
      max-width: 100%;
      text-align: center;
      line-height: 1.15;
      padding: 8px 12px;
    }

    /*5) Botones base*/
    button{
      cursor:pointer;
      border:4px solid var(--ink);
      border-radius:16px;
      padding:10px 12px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.3px;
      box-shadow: 6px 6px 0 var(--ink);
      background:#fff;
      transition: transform .08s ease;
    }
    button:active{ transform: translate(2px,2px); box-shadow: 4px 4px 0 var(--ink); }

    .primary{ background: var(--cyan); width:100%; }
    .ghost{ background:#fffdf6; }

    footer{
      padding:18px 16px 30px;
      opacity:.8;
      text-align:center;
      font-weight:700;
    }

    /*6) Votación (dentro de cada card) */
    .voteBox{
      margin-top:10px;
      padding:10px;
      border:3px solid var(--ink);
      border-radius:16px;
      background:#fffdf6;
      box-shadow: 6px 6px 0 var(--ink);
      position:relative; /* para POW */
    }

    .voteTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:8px;
    }

    .voteTag,
    .scorePill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.2px;
      font-size:12px;
      padding:8px 10px;
      border:3px solid var(--ink);
      border-radius:999px;
      box-shadow: 5px 5px 0 var(--ink);
    }
    .voteTag{ background: var(--pink); }
    .scorePill{ background: var(--yellow); }

    .starsRow{
      display:flex;
      gap:12px;
      justify-content:center;
      align-items:center;
      margin-top:10px;
    }

    .starBtn{
      border:3px solid var(--ink);
      border-radius:14px;
      padding:8px 10px;
      font-weight:1000;
      background: var(--cyan);
      box-shadow: 5px 5px 0 var(--ink);
      cursor:pointer;
    }
    .starBtn:active{ transform: translate(2px,2px); box-shadow: 3px 3px 0 var(--ink); }

    .pop{ animation: pop .18s ease-out; }
    @keyframes pop{
      0%{ transform: scale(1); }
      60%{ transform: scale(1.08); }
      100%{ transform: scale(1); }
    }

    .powFx{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%) rotate(-6deg);
      background: var(--yellow);
      border:4px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
      border-radius:999px;
      padding:8px 12px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.3px;
      pointer-events:none;
      opacity:0;
      animation: pow .55s ease-out forwards;
      white-space:nowrap;
    }
    @keyframes pow{
      0%{ opacity:0; transform: translate(-50%,-40%) scale(.7) rotate(-10deg); }
      25%{ opacity:1; }
      100%{ opacity:0; transform: translate(-50%,-70%) scale(1.05) rotate(6deg); }
    }

    /* 7) Card Ranking */
    .rankTitle{
      margin: 35px 0 50px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.4px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-size:20px;
    }

    .rankBadge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:6px 8px;
      font-size:8px;
      border:3px solid var(--ink);
      border-radius:999px;
      background: var(--yellow);
      box-shadow: 5px 5px 0 var(--ink);
      font-weight:1000;
      text-transform:uppercase;
    }

    .rankList{ display:flex; flex-direction:column; gap:6px; }

    .rankRow{
      display:grid;
      grid-template-columns: 44px 1fr auto;
      padding:6px 8px;
      gap:8px;
      align-items:center;
      border:3px solid var(--ink);
      border-radius:16px;
      background:#fffdf6;
      box-shadow: 6px 6px 0 var(--ink);
    }

    .rankPos{
      width:30px;
      height:30px;
      font-size:13px;
      border-radius:14px;
      border:3px solid var(--ink);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:1000;
      background: var(--cyan);
      box-shadow: 5px 5px 0 var(--ink);
    }

    .rankName{
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.3px;
      font-size:13px;
      line-height:1.1;
    }

    .rankMeta{
      font-weight:1000;
      text-transform:uppercase;
      font-size:11px;
      opacity:.9;
      text-align:right;
      white-space:nowrap;
    }

    .rankTop1 .rankPos{ background:#ffe45c; }
    .rankTop2 .rankPos{ background:#d7f0ff; }
    .rankTop3 .rankPos{ background:#ffd1a8; }

    .rankHint{
      font-weight:800;
      opacity:.8;
      margin-top:18px;
      font-size:12px;
    }

    /* 8) Card Profe (relleno) */
    .card--profe{
      background: linear-gradient(135deg, #fff 0%, #e4c3e6 100%);
      transform: rotate(-1deg);
    }

    .profeAvatar{
      filter: contrast(1.05) saturate(1.1);
    }

    .profeSignature{
      margin-top:8px;
      font-weight:1000;
      text-transform:uppercase;
      font-size:12px;
      opacity:.8;
      letter-spacing:.3px;
    }

    /* efecto firma tipo cómic */
    .card--profe .cardBody{
      position:relative;
      overflow: hidden;
    }
    .card--profe .cardInner,
    .card--profe .avatar,
    .card--profe .cardBody{
      position: relative;
      z-index: 2;
    }

    /* FX Profe (zona visual bajo la firma) */
    .profeFx{
      margin-top: 12px;
      padding: 12px;
      border: 3px solid var(--ink);
      border-radius: 18px;
      background: rgba(255,255,255,.75);
      box-shadow: 8px 8px 0 var(--ink);
      position: relative;
      overflow: hidden;
    }

    .profeFx::before{
      content:"";
      position:absolute;
      inset:-30px;
      background:
        radial-gradient(circle, rgba(0,0,0,.12) 1.2px, transparent 1.3px) 0 0/10px 10px,
        radial-gradient(circle at 20% 30%, rgba(255,90,165,.18) 0 22%, transparent 23%),
        radial-gradient(circle at 80% 40%, rgba(77,215,255,.18) 0 22%, transparent 23%),
        radial-gradient(circle at 50% 90%, rgba(255,228,92,.20) 0 22%, transparent 23%);
      pointer-events:none;
      opacity:.55;
    }

    .fxSticker{
      position: relative;
      z-index: 1;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 10px 14px;
      border: 4px solid var(--ink);
      border-radius: 999px;
      background: var(--yellow);
      box-shadow: 10px 10px 0 var(--ink);
      font-weight: 1100;
      text-transform: uppercase;
      letter-spacing: .4px;
      transform: rotate(-2deg);
      animation: stickerWobble 2.6s ease-in-out infinite;
    }

    .fxSpark{
      display:inline-block;
      animation: sparkPop 1.2s ease-in-out infinite;
    }

    @keyframes stickerWobble{
      0%,100%{ transform: rotate(-2deg) translateY(0); }
      50%{ transform: rotate(1deg) translateY(-1px); }
    }

    @keyframes sparkPop{
      0%,100%{ transform: scale(1); }
      50%{ transform: scale(1.22) rotate(8deg); }
    }

    .fxBadges{
      position: relative;
      z-index: 1;
      margin-top: 12px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .fxBadge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 10px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 6px 6px 0 var(--ink);
      font-weight: 1000;
      text-transform: uppercase;
      letter-spacing: .25px;
      font-size: 12px;
      animation: badgeFloat 3.2s ease-in-out infinite;
    }

    .fxBadge:nth-child(2){ animation-delay: .2s; }
    .fxBadge:nth-child(3){ animation-delay: .4s; }
    .fxBadge:nth-child(4){ animation-delay: .6s; }

    @keyframes badgeFloat{
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-2px); }
    }

    /* 9) Card Malvat (Bernardo)*/
    .card--malvat{
      background: linear-gradient(135deg, #fff 0%, #ffd6d6 100%);
      box-shadow: 10px 10px 0 #8b0000;
    }

    .card--malvat .pill{
      background: #ff4d4d;
      color: #111;
      border-color: #8b0000;
      box-shadow: 6px 6px 0 #8b0000;
    }

    .card--malvat .name{
      color: #8b0000;
    }

    .card--malvat .avatar{
      filter: contrast(1.15) saturate(1.2);
    }

    .card--malvat::before{
      background: radial-gradient(circle, rgba(139,0,0,.25) 1.2px, transparent 1.3px);
      opacity:.45;
    }

    .card--malvat .tape{
      background: rgba(255,90,90,.9);
      transform: rotate(6deg);
    }

    /*10) Comic modal (popup)*/
    .comicOverlay{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:9999;
    }
    .comicOverlay.show{ display:flex; }

    .comicCard{
      width: min(980px, 100%);
      background:#fff;
      border:5px solid var(--ink);
      border-radius:22px;
      box-shadow: 10px 10px 0 var(--ink);
      position:relative;
      overflow:hidden;
      animation: comicIn .35s ease-out forwards;
    }
    @keyframes comicIn{
      from{ transform: translateY(10px) scale(.98); opacity:0; }
      to{ transform: translateY(0) scale(1); opacity:1; }
    }

    .comicCard::before{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(circle, rgba(0,0,0,.08) 1.2px, transparent 1.3px);
      background-size: 10px 10px;
      opacity:.22;
      pointer-events:none;
    }

    .comicTape{
      position:absolute;
      top:-12px;
      left:18px;
      width:120px;
      height:40px;
      background: rgba(255,228,92,.85);
      border:4px solid var(--ink);
      box-shadow: 8px 8px 0 var(--ink);
      transform: rotate(-8deg);
      border-radius:12px;
      z-index:2;
    }
    .comicTape::before{
      content:"";
      position:absolute;
      inset:0;
      background: repeating-linear-gradient(45deg, rgba(0,0,0,.07) 0 7px, transparent 7px 14px);
      opacity:.6;
      border-radius:10px;
    }

    .comicTop{
      position:relative;
      z-index:1;
      padding:20px 18px 10px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
    }

    .comicTitle{
      font-family: var(--comicTitle);
      letter-spacing: .8px;
      text-shadow: 1px 0.5px 0 var(--ink);
    }

    .comicSub{
      font-family: var(--comicTitle);
      letter-spacing: .4px;
    }

    /* Última página: ocultar botón inferior "Següent" */
    .comic-last #comicNext{ display: none; }
    .comic-last #comicPrev{ margin-left: auto; }

    .comicClose{
      cursor:pointer;
      border:4px solid var(--ink);
      background: var(--pink);
      border-radius:14px;
      box-shadow: 6px 6px 0 var(--ink);
      padding:8px 12px;
      font-weight:1000;
      line-height:1;
    }
    .comicClose:active{ transform: translate(2px,2px); box-shadow: 4px 4px 0 var(--ink); }

    .comicStage{
      position:relative;
      z-index:1;
      padding: 0 18px 12px;
      min-height:250px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .comicPage{
      width:100%;
      border:4px solid var(--ink);
      border-radius:22px;
      box-shadow: 10px 10px 0 var(--ink);
      background:#fffdf6;
      overflow:hidden;
      animation: pageIn .28s ease-out;
    }
    @keyframes pageIn{
      from{ transform: translateX(18px); opacity:.2; }
      to{ transform: translateX(0); opacity:1; }
    }

    .comicCover{ padding:22px; text-align:center; }

    .coverBig{
      font-family: var(--comicTitle);
      margin-top: 0;
      text-transform: uppercase;
      letter-spacing: .8px;
      line-height: .95;
      text-shadow:
        1px 1px 0 var(--ink),
        1px 0 0 var(--ink),
        0 0.5px 0 var(--ink);
    }

    .coverKicker,
    .coverSubBig,
    .coverBadge,
    .coverSticker,
    .coverNote{
      font-family: var(--comicTitle);
      letter-spacing: .5px;
    }

    .coverBurst{
      display:inline-flex;
      gap:10px;
      margin-bottom: 18px;
      align-items:center;
      padding:10px 14px;
      border:4px solid var(--ink);
      border-radius:999px;
      box-shadow: 8px 8px 0 var(--ink);
      background: var(--yellow);
      font-weight:1000;
      text-transform:uppercase;
    }

    .coverHint{ margin-top:14px; font-weight:900; opacity:.85; }

    .comicStudent{
      display:grid;
      grid-template-columns: 220px 1fr;
      gap:0;
    }
    @media (max-width:720px){ .comicStudent{ grid-template-columns: 1fr; } }

    .studentImg{
      width:100%;
      height:100%;
      min-height:260px;
      object-fit:cover;
      border-right:4px solid var(--ink);
      background:#f3f3f3;
    }
    @media (max-width:720px){
      .studentImg{ border-right:0; border-bottom:4px solid var(--ink); }
    }

    .studentBody{ padding:16px; }

    .studentNameRow{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    .studentName{
      margin:0;
      font-weight:1100;
      text-transform:uppercase;
      letter-spacing:.4px;
      font-size:20px;
    }

    .studentTag{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:8px 10px;
      border:3px solid var(--ink);
      border-radius:999px;
      background: var(--yellow);
      font-weight:1000;
      text-transform:uppercase;
      font-size:12px;
      box-shadow: 6px 6px 0 var(--ink);
    }

    .studentSpeech{
      margin-top:12px;
      padding:12px;
      border:4px solid var(--ink);
      border-radius:18px;
      box-shadow: 8px 8px 0 var(--ink);
      background:#fff;
      position:relative;
      font-weight:900;
      opacity:.92;
    }
    .studentSpeech::after{
      content:"";
      position:absolute;
      left:18px;
      bottom:-14px;
      width:15px;
      height:15px;
      background:#fff;
      border-left:4px solid var(--ink);
      border-bottom:4px solid var(--ink);
      transform: rotate(45deg);
    }

    .studentMini{
      margin-top:12px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .studentMiniPill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border:3px solid var(--ink);
      border-radius:999px;
      background: var(--cyan);
      font-weight:1000;
      text-transform:uppercase;
      font-size:12px;
      box-shadow: 6px 6px 0 var(--ink);
    }

    .comicBottom{
      position:relative;
      z-index:1;
      padding: 0 18px 18px;
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      border-top:4px solid var(--ink);
      background: rgba(255,247,230,.6);
    }

    .comicProgress{ display:flex; align-items:center; gap:10px; }

    .comicPageTxt{
      font-weight:1000;
      text-transform:uppercase;
      padding:8px 10px;
      border:3px solid var(--ink);
      border-radius:999px;
      background:#fff;
      box-shadow: 6px 6px 0 var(--ink);
    }

    .comicDots{ display:flex; gap:6px; align-items:center; }

    .dot{
      width:12px;
      height:12px;
      border:3px solid var(--ink);
      border-radius:999px;
      background:#fff;
      box-shadow: 4px 4px 0 var(--ink);
      opacity:.55;
    }
    .dot.active{ background: var(--pink); opacity:1; }

    .comicBtns{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

    .comicPrimary{
      cursor:pointer;
      border:5px solid var(--ink);
      background: var(--cyan);
      border-radius:18px;
      box-shadow: 10px 10px 0 var(--ink);
      padding:12px 16px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.4px;
    }
    .comicPrimary:active{ transform: translate(2px,2px); box-shadow: 8px 8px 0 var(--ink); }

    .comicCheck{
      font-weight:900;
      opacity:.85;
      display:flex;
      gap:8px;
      align-items:center;
    }

    /* Estilos de la página de la profe en el comic */
    .comicProfe .profeImg{ filter: contrast(1.05) saturate(1.05); }

    .comicBurst{
      display:inline-flex;
      align-items:center;
      gap:10px;
      margin-top:12px;
      padding:10px 14px;
      border:4px solid var(--ink);
      border-radius:999px;
      background: var(--yellow);
      box-shadow: 10px 10px 0 var(--ink);
      font-weight:1100;
      text-transform:uppercase;
      letter-spacing:.4px;
      transform: rotate(-2deg);
    }

    .profeSpeech{
      font-size: 15px;
      line-height: 1.35;
    }

    .comicProfe .studentBody{
      background: radial-gradient(circle, rgba(0,0,0,.08) 1.2px, transparent 1.3px);
      background-size: 10px 10px;
      border-left: 4px solid var(--ink);
    }

    /* Portada del comic */
    .comicCoverPage{
      background:
        radial-gradient(circle, rgba(0,0,0,.12) 1.2px, transparent 1.3px) 0 0/10px 10px,
        radial-gradient(circle, rgba(0,0,0,.08) 1px, transparent 1.1px) 4px 4px/14px 14px,
        linear-gradient(180deg, #fffdf6 0%, #fff2c9 100%);
    }

    .comicCoverGrid{
      position: relative;
      padding: 26px;
      min-height: 380px;
      display: grid;
      gap: 18px;
      align-content: center;
      border: 6px solid var(--ink);
      border-radius: 24px;
      box-shadow: 12px 12px 0 var(--ink);
      background: #fffdf6;
      overflow:hidden;
    }

    .comicCoverGrid::before{
      content:"";
      position:absolute;
      inset:-60px;
      background:
        repeating-conic-gradient(from 10deg, rgba(0,0,0,.08) 0 6deg, transparent 6deg 12deg),
        radial-gradient(circle at 20% 20%, rgba(255,90,165,.22) 0 22%, transparent 23%),
        radial-gradient(circle at 85% 30%, rgba(77,215,255,.22) 0 22%, transparent 23%),
        radial-gradient(circle at 40% 90%, rgba(255,228,92,.26) 0 24%, transparent 25%);
      transform: rotate(-6deg);
      pointer-events:none;
      opacity:.9;
    }

    .comicCoverGrid::after{
      content:"";
      position:absolute;
      inset:0;
      box-shadow: inset 0 0 0 6px var(--ink), inset 0 0 60px rgba(0,0,0,.15);
      pointer-events:none;
      opacity:.35;
    }

    .coverSticker{
      position:absolute;
      top:18px;
      right:18px;
      background: var(--pink);
      border:4px solid var(--ink);
      box-shadow: 8px 8px 0 var(--ink);
      border-radius: 14px;
      padding: 10px 12px;
      font-weight:1100;
      text-transform:uppercase;
      letter-spacing:.4px;
      transform: rotate(3deg);
      z-index:2;
    }

    .coverHead{ position:relative; z-index:2; text-align:center; }

    .coverPow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 10px 16px;
      background: var(--yellow);
      border: 5px solid var(--ink);
      border-radius: 999px;
      box-shadow: 10px 10px 0 var(--ink);
      font-weight:1200;
      letter-spacing:.5px;
      text-transform:uppercase;
      transform: rotate(-3deg);
      margin-bottom: 12px;
    }

    .coverKicker{
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.35px;
      opacity:.85;
      margin-bottom: 8px;
    }

    .coverSubBig{
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.35px;
      opacity:.9;
      margin-top: 8px;
      font-size: 16px;
    }

    .coverBadges{
      position:relative;
      z-index:2;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
    }

    .coverBadge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 10px 12px;
      border:4px solid var(--ink);
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 8px 8px 0 var(--ink);
      font-weight:1100;
      text-transform:uppercase;
      letter-spacing:.35px;
      font-size:12px;
    }

    .coverNote{
      position:relative;
      z-index:2;
      text-align:center;
      margin-top: 8px;
      font-weight:900;
      border:4px solid var(--ink);
      border-radius: 18px;
      box-shadow: 10px 10px 0 var(--ink);
      background:#fff;
      padding: 12px 14px;
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap titleRow">
      <div>
        <h1>Segon de GSDAW</h1>
        <div class="subtitle">Benvinguts a la nostra classe - DAW</div>
      </div>

      <button id="rankToggle" class="ghost">🏆 Ranking: OFF</button>
      <div class="pow">¡ZAS! <small>Coneix els nostres projectes</small></div>
    </div>
  </header>

  <main class="wrap">
    <section class="panel">
      <div class="toolbar">
        <div class="search">
          <input id="q" type="text" placeholder="Buscar per nom o per descripció…" aria-label="Buscar" />
          <span id="count" class="counter">0 alumnes</span>
        </div>
      </div>

      <div id="cards" class="cards"></div>
    </section>
  </main>

  <div class="wrap" style="padding-top:0;">
    <button id="resetVotes" class="ghost" style="width:100%;">🔄 Reset</button>
  </div>

  <footer>
    Beatriz López Olmo per IES Santa Maria d'Eivissa
  </footer>

  <!--COMIC MODAL -->
  <div id="comicModal" class="comicOverlay" aria-hidden="true">
    <div class="comicCard" role="dialog" aria-modal="true" aria-labelledby="comicTitle">
      <div class="comicTape"></div>

      <div class="comicTop">
        <div>
          <h2 id="comicTitle" class="comicTitle">Benvinguts a la nostra classe!</h2>
          <p class="comicSub">Fira d'FP Orientat</p>
          <button id="comicSoundToggle" class="comicClose">🔊</button>
        </div>

        <button id="comicClose" class="comicClose" aria-label="Tancar">✕</button>
      </div>

      <div id="comicStage" class="comicStage"></div>

      <div class="comicBottom">
        <div class="comicProgress">
          <span id="comicPageTxt" class="comicPageTxt">1 / 1</span>
          <div class="comicDots" id="comicDots"></div>
        </div>

        <div class="comicBtns">
          <button id="comicPrev" class="ghost">← Anterior</button>
          <button id="comicNext" class="comicPrimary">Següent →</button>
        </div>

        <label class="comicCheck">
          <input id="comicHideOnce" type="checkbox" />
          No tornar a mostrar (aquesta sessió)
        </label>
      </div>
    </div>
  </div>

  <script>
    // 1) Audio
    const voteSound = new Audio("sounds/arcade.mp3");
    voteSound.volume = 0.4;

    const comicMusic = new Audio("sounds/holdingout.mp3");
    comicMusic.loop = true;
    comicMusic.volume = 0;

    let comicMusicStarted = false;
    let soundEnabled = true;
    let musicFadeInterval = null;

    function fadeInMusic(target = 0.35, step = 0.02, delay = 80){
      clearInterval(musicFadeInterval);
      musicFadeInterval = setInterval(() => {
        if (comicMusic.volume < target){
          comicMusic.volume = Math.min(target, comicMusic.volume + step);
        } else {
          clearInterval(musicFadeInterval);
        }
      }, delay);
    }

    function fadeOutMusic(step = 0.03, delay = 80){
      clearInterval(musicFadeInterval);
      musicFadeInterval = setInterval(() => {
        if (comicMusic.volume > 0){
          comicMusic.volume = Math.max(0, comicMusic.volume - step);
        } else {
          comicMusic.pause();
          comicMusic.currentTime = 0;
          clearInterval(musicFadeInterval);
          comicMusicStarted = false;
        }
      }, delay);
    }

    function startComicMusic(){
      if (!soundEnabled || comicMusicStarted) return;
      comicMusicStarted = true;
      comicMusic.play().then(() => fadeInMusic()).catch(() => {});
    }

    // 2) Datos (Profe / Alumnos)
    const PROFE = {
      name: "Beatriz López Olmo",
      avatar: "avatars/Beatriz.png",
      role: "Superheroïna",
      introTitle: "Benvinguts i Benvingudes!",
      introText:
        "Sóc la Bea i avui us presento el meu equip de herois! 💥\n" +
        "Passa pàgina i coneix els seus portfolis. I no t'oblidis de votar! ⭐"
    };

    const ALUMNOS = [
      { name:"Victor",   avatar:"avatars/Victor.png",   desc:"Com un llamp en un dia ennuvolat: pensa ràpid, crea amb brillantor i sempre està a punt per donar un cop de mà.", link:"portfolios/Victor/index.html" },
      { name:"Sergio",   avatar:"avatars/Sergio.png",   desc:"Com un mecànic d’idees: ajusta cada detall, poleix els projectes i fa que tot funcioni com un rellotge.", link:"portfolios/Sergio/index.html" },
      { name:"Hugo",     avatar:"avatars/Hugo.png",     desc:"Com un explorador inquiet: prova camins nous, aprèn de cada error i torna sempre amb idees fresques.", link:"portfolios/Hugo/index.html" },
      { name:"Manuel",   avatar:"avatars/Manuel.png",   desc:"Com un arquitecte pacient: construeix pas a pas, amb criteri i sense deixar res a l’atzar, sempre disposat a ajudar.", link:"portfolios/Manuel/index.html" },
      { name:"Nicolás",  avatar:"avatars/Nicolas.png",  desc:"Com un artesà digital: treballa amb cura, combina tècnica amb creativitat, i la perfecció pot ser el seu segon cognom.", link:"portfolios/Nicolas/index.html" },
      { name:"Bernardo", avatar:"avatars/Bernardo.png", desc:"Com un motor constant: no s’atura davant les dificultats i manté l’energia fins al final del projecte.", link:"portfolios/Bernardo/index.html", role:"malvat" },
      { name:"Haibo",    avatar:"avatars/Haibo.png",    desc:"Com una brúixola en plena aventura: observador, constant i amb un nord clar quan toca investigar.", link:"portfolios/Haibo/index.html" }
    ];

    const PROFE_CARD = {
      name: "Beatriz López Olmo",
      avatar: "avatars/Beatriz.png",
      role: "Superheroïna del Disseny Web",
      phrase: "Mentorant la pròxima generació de desenvolupadors 💥"
    };

    // 3) Storage
    const STORAGE_STATS = "comic_votes_stats_v1";

    function loadStats(){
      try { return JSON.parse(localStorage.getItem(STORAGE_STATS)) || {}; }
      catch { return {}; }
    }

    function saveStats(stats){
      localStorage.setItem(STORAGE_STATS, JSON.stringify(stats));
    }


    // 4) DOM refs
    const cardsEl = document.getElementById("cards");
    const qEl = document.getElementById("q");
    const countEl = document.getElementById("count");
    const resetVotesBtn = document.getElementById("resetVotes");
    const rankToggleBtn = document.getElementById("rankToggle");

    // Comic DOM
    const comicModal = document.getElementById("comicModal");
    const comicStage = document.getElementById("comicStage");
    const comicClose = document.getElementById("comicClose");
    const comicPrev = document.getElementById("comicPrev");
    const comicNext = document.getElementById("comicNext");
    const comicPageTxt = document.getElementById("comicPageTxt");
    const comicDots = document.getElementById("comicDots");
    const comicHideOnce = document.getElementById("comicHideOnce");
    const comicSoundToggle = document.getElementById("comicSoundToggle");

    // 5) Helpers
    const escapeHtml = (str) => String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll("\"","&quot;")
      .replaceAll("'","&#039;");

    const getKey = (a) => (a.link || a.name || "").trim().toLowerCase();
    const formatScore = (sum, count) => `${sum} pts · ${count} vots`;

    // 6) Estado
    let rankingActive = false;

    // 7) Ranking card (HTML)
    function buildRankingCard(){
      const statsMap = loadStats();

      const standings = ALUMNOS
        .map(s => {
          const key = getKey(s);
          const st = statsMap[key] || { sum:0, count:0 };
          return { name: s.name, sum: st.sum, count: st.count };
        })
        .sort((a,b) => (b.sum - a.sum) || (b.count - a.count) || a.name.localeCompare(b.name));

      return `
        <article class="card" style="--dotSize:14px; --dotOpacity:.22;">
          <div class="cardInner">
            <span class="tape"></span>
            <div class="cardBody">
              <div class="rankTitle">
                <span>🏆 Rànquing en viu</span>
                <span class="rankBadge">Vots</span>
              </div>

              <div class="rankList">
                ${standings.map((r, idx) => `
                  <div class="rankRow ${idx===0?"rankTop1":idx===1?"rankTop2":idx===2?"rankTop3":""}">
                    <div class="rankPos">${idx+1}</div>
                    <div class="rankName">${escapeHtml(r.name)}</div>
                    <div class="rankMeta">${r.sum} pts · ${r.count} vots</div>
                  </div>
                `).join("")}
              </div>

              <div class="rankHint">💥 Vota els portfolis i veuràs com canvia el marcador!</div>
            </div>
          </div>
        </article>
      `;
    }

    // 8) Render principal (cards + votos)
  
    function render(){
      const q = (qEl?.value || "").trim().toLowerCase();
      const statsMap = loadStats();

      // 8.1) Filtrado de alumnos (búsqueda)
      let list = ALUMNOS.filter(a => {
        if (!q) return true;
        return (a.name || "").toLowerCase().includes(q) ||
               (a.desc || "").toLowerCase().includes(q);
      });

      // 8.2) Añadir ranking (siempre, pero se gestiona visualmente)
      list = [...list, { __ranking: true }];

      // 8.3) Relleno para cuadrar el grid (múltiplos de 3)
      const cols = 3;
      const remainder = list.length % cols;
      if (remainder !== 0) {
        const needed = cols - remainder;
        for (let i = 0; i < needed; i++) list.push({ __filler: true });
      }

      // 8.4) Orden por ranking (sin mover ranking ni fillers al medio)
      if (rankingActive) {
        list = [...list].sort((a, b) => {
          if (a.__ranking) return 1;
          if (b.__ranking) return -1;
          if (a.__filler) return 1;
          if (b.__filler) return -1;

          const sa = statsMap[getKey(a)] || { sum:0, count:0 };
          const sb = statsMap[getKey(b)] || { sum:0, count:0 };
          return (sb.sum - sa.sum);
        });
      }

      // 8.5) Contador: SOLO alumnos (no ranking ni profe)
      const alumnosCount = ALUMNOS.filter(a => {
        if (!q) return true;
        return (a.name || "").toLowerCase().includes(q) ||
               (a.desc || "").toLowerCase().includes(q);
      }).length;

      if (countEl){
        countEl.textContent = `${alumnosCount} alumne${alumnosCount === 1 ? "" : "s"}`;
      }

      // 8.6) Pintar cards
      cardsEl.innerHTML = list.map((a, i) => {
        // Ranking
        if (a.__ranking) return buildRankingCard();

        // Profe
        if (a.__filler) {
          return `
            <article class="card card--profe">
              <div class="cardInner">
                <span class="tape"></span>
                <img class="avatar profeAvatar" src="${escapeHtml(PROFE_CARD.avatar)}" alt="Avatar ${escapeHtml(PROFE_CARD.name)}" />
                <div class="cardBody">
                  <div class="cardTop">
                    <h3 class="name">${escapeHtml(PROFE_CARD.name)}</h3>
                    <span class="pill">🎓 ${escapeHtml(PROFE_CARD.role)}</span>
                  </div>
                  <p class="desc">${escapeHtml(PROFE_CARD.phrase)}</p>
                  <div class="profeSignature"> — Creadora del projecte</div>

                  <div class="profeFx">
                    <div class="fxSticker">
                      <span class="fxSpark">✨</span>CONTACTA AMB NOSALTRES
                    </div>

                    <div class="fxBadges">
                      <span class="fxBadge">🎯 ABP</span>
                      <span class="fxBadge">💻 DAW</span>
                      <span class="fxBadge">🎨 UI/UX</span>
                      <span class="fxBadge">🚀 Projectes reals</span>
                    </div>
                  </div>
                </div>
              </div>
            </article>
          `;
        }

        // Alumno normal
        const name = escapeHtml(a.name || "Alumno/a");
        const desc = escapeHtml(a.desc || "");
        const avatar = escapeHtml(a.avatar || "");
        const link = escapeHtml(a.link || "#");

        const key = getKey(a);
        const st = statsMap[key] || { sum:0, count:0 };

        const isMalvat = a.role === "malvat";
        let badge = isMalvat ? "☠ MALVAT" : "★ HEROI";
        if (rankingActive && i < 3) badge = ["🥇 TOP 1", "🥈 TOP 2", "🥉 TOP 3"][i];

        const dotSize = 8 + (i % 4) * 3;
        const dotOpacity = 0.22 + (i % 3) * 0.06;

        return `
          <article class="card ${isMalvat ? "card--malvat" : ""}"
            style="--dotSize:${dotSize}px; --dotOpacity:${dotOpacity};">
            <div class="cardInner">
              <span class="tape"></span>
              <img class="avatar" src="${avatar}" alt="Avatar de ${name}" />
              <div class="cardBody">
                <div class="cardTop">
                  <h3 class="name">${name}</h3>
                  <span class="pill">${badge}</span>
                </div>

                <p class="desc">${desc}</p>

                <a href="${link}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;">
                  <button class="primary">Veure portfolio ↗</button>
                </a>

                <div class="voteBox" data-key="${escapeHtml(key)}">
                  <div class="voteTop">
                    <span class="voteTag">💥 Vota</span>
                    <span class="scorePill">${formatScore(st.sum, st.count)}</span>
                  </div>

                  <div class="starsRow">
                    ${[1,2,3].map(n => `
                      <button class="starBtn" data-key="${escapeHtml(key)}" data-vote="${n}">
                        ${"⭐".repeat(n)}
                      </button>
                    `).join("")}
                  </div>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");

      // 8.7) Eventos de voto
      cardsEl.querySelectorAll(".starBtn").forEach(btn => {
        btn.addEventListener("click", () => {
          voteSound.currentTime = 0;
          voteSound.play().catch(() => {});

          const key = btn.getAttribute("data-key");
          const value = Number(btn.getAttribute("data-vote"));

          const stats = loadStats();
          const st = stats[key] || { sum:0, count:0 };
          st.sum += value;
          st.count += 1;
          stats[key] = st;
          saveStats(stats);

          render();

          const box = cardsEl.querySelector(`.voteBox[data-key="${CSS.escape(key)}"]`);
          if (!box) return;

          const fx = document.createElement("div");
          fx.className = "powFx";
          fx.textContent = `POW! +${value}`;
          box.appendChild(fx);
          setTimeout(() => fx.remove(), 600);

          const scorePill = box.querySelector(".scorePill");
          if (scorePill){
            scorePill.classList.remove("pop");
            void scorePill.offsetWidth;
            scorePill.classList.add("pop");
          }

          const sameBtn = box.querySelector(`.starBtn[data-vote="${value}"]`);
          if (sameBtn){
            sameBtn.classList.remove("pop");
            void sameBtn.offsetWidth;
            sameBtn.classList.add("pop");
          }
        });
      });
    }

    // 9) Ranking toggle
    rankToggleBtn?.addEventListener("click", () => {
      rankingActive = !rankingActive;
      rankToggleBtn.textContent = rankingActive ? "🏆 Ranking: ON" : "🏆 Ranking: OFF";
      render();
    });

    // 10) Reset votes
    resetVotesBtn?.addEventListener("click", () => {
      if (!confirm("¿Resetear TODOS los votos?")) return;
      localStorage.removeItem(STORAGE_STATS);
      render();
    });

    // 11) Comic modal (paginación + contenido)
    let comicIndex = 0;
    const totalPages = 1 + 1 + ALUMNOS.length + 1;

    function renderDots(){
      comicDots.innerHTML = "";
      for (let i=0;i<totalPages;i++){
        const d = document.createElement("div");
        d.className = "dot" + (i===comicIndex ? " active" : "");
        comicDots.appendChild(d);
      }
    }

    function renderComicPage(){
      comicModal.classList.remove("comic-last");

      comicPageTxt.textContent = `${comicIndex+1} / ${totalPages}`;
      renderDots();

      comicPrev.disabled = (comicIndex === 0);
      comicPrev.style.opacity = comicPrev.disabled ? ".6" : "1";

      comicNext.textContent = (comicIndex === totalPages - 1) ? "ENTRAR →" : "Següent →";

      // Página 1: Portada
      if (comicIndex === 0){
        comicStage.innerHTML = `
          <div class="comicPage comicCoverPage">
            <div class="comicCover comicCoverGrid">
              <div class="coverSticker">Nº 1 · EDICIÓ 2026</div>

              <div class="coverHead">
                <div class="coverPow">💥 BOOM!</div>
                <div class="coverKicker">Fira FP Orientat</div>
                <div class="coverBig">Benvinguts a la nostra classe</div>
                <div class="coverSubBig">GS DAW · Super Projectes</div>
              </div>

              <div class="coverBadges">
                <span class="coverBadge">⭐ VOTA 1–3</span>
                <span class="coverBadge">🏆 RÀNQUING EN VIU</span>
                <span class="coverBadge">📁 PORTFOLIS REALS</span>
              </div>

              <div class="coverNote">
                <strong>Comença l’aventura!</strong><br/>
                Passa pàgina per conèixer els protagonistes 👇
              </div>
            </div>
          </div>
        `;
        return;
      }

      // Página 2: La profe presenta
      if (comicIndex === 1) {
        comicStage.innerHTML = `
          <div class="comicPage">
            <div class="comicStudent comicProfe">
              <img class="studentImg profeImg" src="${escapeHtml(PROFE.avatar)}" alt="Avatar ${escapeHtml(PROFE.name)}">
              <div class="studentBody">
                <div class="studentNameRow">
                  <h3 class="studentName">${escapeHtml(PROFE.name)}</h3>
                  <span class="studentTag">🗯 ${escapeHtml(PROFE.role)}</span>
                </div>

                <div class="comicBurst">💥 ${escapeHtml(PROFE.introTitle)}</div>

                <div class="studentSpeech profeSpeech">${escapeHtml(PROFE.introText)}</div>

                <div class="studentMini">
                  <span class="studentMiniPill">📚 Projectes reals</span>
                  <span class="studentMiniPill">⭐ Vota 1–3</span>
                  <span class="studentMiniPill">🏆 Rànquing en viu</span>
                </div>
              </div>
            </div>
          </div>
        `;
        return;
      }

      // Páginas alumnos
      if (comicIndex >= 2 && comicIndex <= (ALUMNOS.length + 1)) {
        const a = ALUMNOS[comicIndex - 2];
        comicStage.innerHTML = `
          <div class="comicPage">
            <div class="comicStudent">
              <img class="studentImg" src="${escapeHtml(a.avatar)}" alt="Avatar ${escapeHtml(a.name)}">
              <div class="studentBody">
                <div class="studentNameRow">
                  <h3 class="studentName">${escapeHtml(a.name)}</h3>
                  <span class="studentTag">★ heroi</span>
                </div>

                <div class="studentSpeech">${escapeHtml(a.desc)}</div>

                <div class="studentMini">
                  <span class="studentMiniPill">⭐ Vota: 1–3</span>
                  <span class="studentMiniPill">🏆 Mira el rànquing</span>
                  <span class="studentMiniPill">📁 Obre el portfolio</span>
                </div>
              </div>
            </div>
          </div>
        `;
        return;
      }

      // Última página
      comicStage.innerHTML = `
        <div class="comicPage">
          <div class="comicCover">
            <div class="coverBurst">✅ Preparats?</div>
            <div class="coverBig">A votar!</div>
            <div class="coverHint">Clica ENTRAR per començar 💥</div>

            <div style="margin-top:14px;">
              <button id="comicEnterNow" class="comicPrimary">ENTRAR →</button>
            </div>
          </div>
        </div>
      `;

      comicModal.classList.add("comic-last");
      return;
    }

    function openComic(){
      comicModal.classList.add("show");
      comicModal.setAttribute("aria-hidden","false");
      comicIndex = 0;
      renderComicPage();
      comicMusic.currentTime = 0;
    }

    function closeComic(){
      comicModal.classList.remove("show");
      comicModal.setAttribute("aria-hidden","true");
      fadeOutMusic();

      if (comicHideOnce.checked){
        sessionStorage.setItem("hide_comic_once","1");
      }
    }

    // 12) Eventos del comic (botones + clicks + teclado)

    comicPrev.addEventListener("click", () => {
      if (comicIndex > 0){ comicIndex--; renderComicPage(); }
    });

    comicNext.addEventListener("click", () => {
      startComicMusic();
      if (comicIndex >= totalPages - 1){ closeComic(); return; }
      comicIndex++;
      renderComicPage();
    });

    comicClose.addEventListener("click", (e) => {
      e.stopPropagation();
      closeComic();
    });

    comicStage.addEventListener("click", (e) => {
      if (e.target && e.target.id === "comicEnterNow"){
        e.stopPropagation();
        closeComic();
      }
    });

    comicModal.addEventListener("click", (e) => {
      const id = e.target?.id;
      if (id === "comicClose" || id === "comicEnterNow" || id === "comicSoundToggle") return;
      if (e.target === comicModal) return;
      startComicMusic();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && comicModal.classList.contains("show")){
        closeComic();
      }
    });

    comicSoundToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      comicSoundToggle.textContent = soundEnabled ? "🔊" : "🔇";
      if (!soundEnabled) fadeOutMusic();
      else startComicMusic();
    });

    // 13) Init
    qEl?.addEventListener("input", render);
    render();

    window.addEventListener("load", () => {
      const hideOnce = sessionStorage.getItem("hide_comic_once") === "1";
      if (!hideOnce) openComic();
    });

    // Para resetear votos manualmente:
    // localStorage.removeItem("comic_votes_stats_v1");
  </script>
</body>
</html>
